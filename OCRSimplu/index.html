<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OCR Simplificat</title>
    <style>
        :root {color-scheme: dark;}

        #outputOCR {
            width: 100%;
            height: 80vh;
            background-color: rgba(0, 0, 0, 0.4);
            z-index: 1;
        }

    </style>
      <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body>
    <div class="butoane">
        <button id="playbtn">Scan</button>
    </div>
    <div id="outputOCR"></div>
    <div id="capturev">
        <video id="video" autoplay playsinline muted></video>
    </div>
    <canvas></canvas>
    <canvas></canvas>
    <script>
        const outputOCR = document.getElementById('outputOCR');
        const video = document.getElementById('video');
        const playbtn = document.getElementById("playbtn");
        const canvas = document.getElementsByTagName('canvas')[0];
        const cropCanvas =  document.getElementsByTagName('canvas')[1];
        const cropCtx = cropCanvas.getContext('2d', { willReadFrequently: true });

        let isCameraOn = false;
        let isPaused = false;
        let worker = null;

        function applyHighContrast(ctx, width, height) {
            const imgData = ctx.getImageData(0, 0, width, height);
            const data = imgData.data;
            for (let i = 0; i < data.length; i += 4) {
                let brightness = (data[i] * 0.299 + data[i+1] * 0.587 + data[i+2] * 0.114);
                let v = brightness > 130 ? 255 : 0; 
                data[i] = data[i+1] = data[i+2] = v;
                data[i+3] = 255;
                }
            ctx.putImageData(imgData, 0, 0);
        }

        playbtn.addEventListener('click', async () => {
            if (!isCameraOn) {
                try {
                    playbtn.disabled = true;
                    if (!worker) {
                        worker = await Tesseract.createWorker('eng');
                    }
                    
                    const stream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: "environment", width: { ideal: 1920 }, height: { ideal: 1080 } },
                        audio: false,
                    });

                    video.srcObject = stream;
                    isCameraOn = true;
                    playbtn.disabled = false;

                    scanLoop();

                } catch (err) {
                    alert(`Eroare: `, err);
                }
            }
        });

    async function scanLoop() {
        if (!isCameraOn || !worker) return;
        if (isPaused) {
            setTimeout(scanLoop, 400);
            return;
        }
        if (video.readyState >= 2 && video.videoWidth > 0) {
            const vW = video.videoWidth;
            const vH = video.videoHeight;

            const cropW = Math.round(vW * 0.70);
            const cropH = Math.round(vH * 0.65);
            const cropX = Math.round((vW - cropW) / 2);
            const cropY = Math.round((vH - cropH) / 2);

            cropCanvas.width = cropW;
            cropCanvas.height = cropH;

            try {
              cropCtx.drawImage(video, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);
              applyHighContrast(cropCtx, cropW, cropH);
            
              const { data: { text } } = await worker.recognize(cropCanvas);
              const cleanText = text.trim();
            
              if (cleanText.length > 2) {
                console.log(cleanText);
                outputOCR.innerText = cleanText;
              }
            } catch (err) {
              console.warn("Eroare procesare:", err);
            }
        }
            setTimeout(scanLoop, 900);
    }
    </script>
</body>
</html>
