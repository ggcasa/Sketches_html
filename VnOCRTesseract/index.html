<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scanner Smart OCR PWA</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #0f0f12; color: #e4e4e7; margin: 0; padding: 15px; text-align: center; }
    .container { max-width: 500px; margin: 0 auto; }
    
    /* Container video care previne letterboxing-ul pe mobil */
    .scanner-container { position: relative; width: 100%; max-width: 450px; margin: 0 auto 15px auto; border-radius: 12px; overflow: hidden; background: #000; display: flex; justify-content: center; align-items: center; }
    
    /* object-fit: cover ajută la umplerea ecranului fără dungi negre */
    video { width: 100%; height: auto; display: block; }
    
    .viewfinder { position: absolute; width: 85%; height: 50px; border: 2px solid #00ffcc; border-radius: 6px; box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.6); pointer-events: none; }

    .box { background: #1c1c1e; padding: 15px; border-radius: 10px; margin-bottom: 15px; border: 1px solid #2c2c2e; }
    .status { font-size: 13px; color: #00ffcc; margin-bottom: 5px; min-height: 18px; }
    .result { font-family: monospace; font-size: 22px; color: #ffffff; font-weight: bold; letter-spacing: 1px; min-height: 30px; word-break: break-all; }
    
    button { background: #00ffcc; color: #000; border: none; padding: 14px 28px; font-size: 16px; font-weight: bold; cursor: pointer; border-radius: 8px; width: 100%; max-width: 450px; margin-bottom: 15px; }
    
    .debug-label { font-size: 12px; color: #888; margin-top: 10px; }
    /* Am făcut Canvas-ul VIZIBIL ca să vezi exact ce decupează matematica pe telefonul tău */
    #cropCanvas { display: block; width: 100%; max-width: 450px; border: 2px dashed #ff3b30; margin: 5px auto; background: #000; }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body>

<div class="container">
  <h2>Scanner Smart OCR</h2>
  <p style="font-size: 14px; color: #8e8e93; margin-top: -10px;">Aliniați textul în vizorul verde</p>
  
  <div class="scanner-container">
    <video id="video" autoplay playsinline></video>
    <div id="viewfinder" class="viewfinder"></div>
  </div>

  <button id="btnStart">Pornește Camera</button>

  <div class="box">
    <div id="statusLabel" class="status">Așteptare cameră...</div>
    <div id="ocrResult" class="result">---</div>
  </div>

  <div class="debug-label">Ce vede inteligența artificială (Debug):</div>
  <canvas id="cropCanvas"></canvas>
</div>

<script>
const video = document.getElementById('video');
const btnStart = document.getElementById('btnStart');
const statusLabel = document.getElementById('statusLabel');
const ocrResult = document.getElementById('ocrResult');
const cropCanvas = document.getElementById('cropCanvas');
const cropCtx = cropCanvas.getContext('2d', { willReadFrequently: true });
const viewfinder = document.getElementById('viewfinder');

let isScanning = false;
let worker = null;

async function initOCR() {
  statusLabel.innerText = "Se încarcă motorul AI...";
  worker = await Tesseract.createWorker('eng');
  
  // ATENȚIE: Am scos complet setarea de "whitelist" cu litere mari.
  // Acum recunoaște și litere mici, spații, sau semne de punctuație.

  statusLabel.innerText = "Motor AI Pregătit. Scanați...";
}

btnStart.addEventListener('click', async () => {
  if (isScanning) return;

  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "environment", width: { ideal: 1920 }, height: { ideal: 1080 } },
      audio: false
    });
    
    video.srcObject = stream;
    btnStart.style.display = "none";
    isScanning = true;

    await initOCR();
    
    // Începem procesarea după ce video-ul are date
    video.addEventListener('loadeddata', scanLoop);
  } catch (err) {
    alert("Eroare acces cameră: " + err.message);
  }
});

async function scanLoop() {
  if (!isScanning || !worker) return;

  if (video.readyState === video.HAVE_ENOUGH_DATA) {
    statusLabel.innerText = "Se analizează cadrul...";

    // 1. Calculăm geometria exactă pentru decupajul de pe mobil
    const videoRect = video.getBoundingClientRect();
    const viewRect = viewfinder.getBoundingClientRect();

    // Factorul real de scalare dintre rezoluția nativă a camerei și mărimea de pe ecran
    const scaleX = video.videoWidth / videoRect.width;
    const scaleY = video.videoHeight / videoRect.height;

    // Coordonatele vizorului tăiate precis
    const cropX = (viewRect.left - videoRect.left) * scaleX;
    const cropY = (viewRect.top - videoRect.top) * scaleY;
    const cropW = viewRect.width * scaleX;
    const cropH = viewRect.height * scaleY;

    // 2. Setăm canvas-ul și desenăm felia
    cropCanvas.width = cropW;
    cropCanvas.height = cropH;
    
    // Curățăm canvas-ul înainte de desenare (previne artefacte)
    cropCtx.clearRect(0, 0, cropW, cropH);
    cropCtx.drawImage(video, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);

    try {
      // 3. Trimitem imaginea decupată către Tesseract
      const { data: { text } } = await worker.recognize(cropCanvas);
      
      const cleanText = text.replace(/\n/g, '').trim();

      if (cleanText.length > 2) {
        ocrResult.innerText = cleanText;
        statusLabel.innerText = "Text detectat!";
      } else {
        statusLabel.innerText = "Poziționați textul...";
      }
    } catch (ocrError) {
      console.error("Eroare OCR:", ocrError);
    }
  }

  // Pe mobil lăsăm puțin mai mult timp de respirație (1200ms) 
  // ca să nu supraîncălzim telefonul Pixel 10 și bateria
  setTimeout(scanLoop, 1200);
}
</script>

</body>
</html>
