<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scanner Smart OCR PWA</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #0f0f12; color: #e4e4e7; margin: 0; padding: 15px; text-align: center; }
    .container { max-width: 500px; margin: 0 auto; }
    
    .scanner-container { position: relative; width: 100%; max-width: 450px; margin: 0 auto 15px auto; border-radius: 12px; overflow: hidden; background: #000; display: flex; justify-content: center; align-items: center; }
    
    /* Ne asigurăm că video-ul își păstrează proporțiile native */
    video { width: 100%; height: auto; display: block; }
    
    .viewfinder { position: absolute; width: 85%; height: 50px; border: 2px solid #00ffcc; border-radius: 6px; box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.6); pointer-events: none; }

    .box { background: #1c1c1e; padding: 15px; border-radius: 10px; margin-bottom: 15px; border: 1px solid #2c2c2e; }
    .status { font-size: 13px; color: #00ffcc; margin-bottom: 5px; min-height: 18px; }
    .result { font-family: monospace; font-size: 22px; color: #ffffff; font-weight: bold; letter-spacing: 1px; min-height: 30px; word-break: break-all; }
    
    button { background: #00ffcc; color: #000; border: none; padding: 14px 28px; font-size: 16px; font-weight: bold; cursor: pointer; border-radius: 8px; width: 100%; max-width: 450px; margin-bottom: 15px; }
    
    .debug-label { font-size: 12px; color: #888; margin-top: 10px; }
    
    /* Reparăm afișarea zonei de debug ca să respecte proporția imaginii tăiate */
    #cropCanvas { display: block; width: 100%; max-width: 450px; height: auto; border: 2px dashed #ff3b30; margin: 5px auto; background: #111; }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body>

<div class="container">
  <h2>Scanner Smart OCR</h2>
  <p style="font-size: 14px; color: #8e8e93; margin-top: -10px;">Aliniați textul în vizorul verde</p>
  
  <div class="scanner-container">
    <video id="video" autoplay playsinline muted></video>
    <div id="viewfinder" class="viewfinder"></div>
  </div>

  <button id="btnStart">Pornește Camera</button>

  <div class="box">
    <div id="statusLabel" class="status">Așteptare cameră...</div>
    <div id="ocrResult" class="result">---</div>
  </div>

  <div class="debug-label" id="debugInfo">Ce vede inteligența artificială (Debug):</div>
  <canvas id="cropCanvas"></canvas>
</div>

<script>
const video = document.getElementById('video');
const btnStart = document.getElementById('btnStart');
const statusLabel = document.getElementById('statusLabel');
const ocrResult = document.getElementById('ocrResult');
const cropCanvas = document.getElementById('cropCanvas');
const cropCtx = cropCanvas.getContext('2d', { willReadFrequently: true });
const viewfinder = document.getElementById('viewfinder');
const debugInfo = document.getElementById('debugInfo');

// Ne asigurăm că vizorul este forțat pe centru (pentru precizia matematicii de decupare)
viewfinder.style.top = '50%';
viewfinder.style.left = '50%';
viewfinder.style.transform = 'translate(-50%, -50%)';

let isScanning = false;
let worker = null;

async function initOCR() {
  statusLabel.innerText = "Se încarcă motorul AI...";
  worker = await Tesseract.createWorker('eng');
  statusLabel.innerText = "Motor AI Pregătit. Porniți camera...";
}

// Inițializăm AI-ul imediat cum se încarcă pagina (în fundal)
initOCR();

btnStart.addEventListener('click', async () => {
  if (isScanning) return;

  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: false
    });
    
    video.srcObject = stream;
    btnStart.style.display = "none";
    isScanning = true;

    statusLabel.innerText = "Camera pornită. Se inițiază fluxul...";
    
    // CORECTURĂ: Pornim bucla direct, fără să mai așteptăm evenimente care se pot pierde
    scanLoop();
    
  } catch (err) {
    alert("Eroare acces cameră: " + err.message);
  }
});

async function scanLoop() {
  if (!isScanning || !worker) return;

  // Verificăm constant dacă video-ul are date valide
  if (video.readyState >= 2 && video.videoWidth > 0 && video.videoHeight > 0) {
    
    const videoRect = video.getBoundingClientRect();
    const viewRect = viewfinder.getBoundingClientRect();

    const pctLeft = (viewRect.left - videoRect.left) / videoRect.width;
    const pctTop = (viewRect.top - videoRect.top) / videoRect.height;
    const pctWidth = viewRect.width / videoRect.width;
    const pctHeight = viewRect.height / videoRect.height;

    const cropX = Math.round(pctLeft * video.videoWidth);
    const cropY = Math.round(pctTop * video.videoHeight);
    const cropW = Math.max(1, Math.round(pctWidth * video.videoWidth));
    const cropH = Math.max(1, Math.round(pctHeight * video.videoHeight));

    cropCanvas.width = cropW;
    cropCanvas.height = cropH;
    
    try {
      // Dacă totul e corect, aici se va desena imaginea reală în căsuța roșie
      cropCtx.drawImage(video, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);
      debugInfo.innerText = `Decupaj: ${cropW}x${cropH}px | X:${cropX} Y:${cropY}`;

      statusLabel.innerText = "Se analizează...";
      const { data: { text } } = await worker.recognize(cropCanvas);
      
      const cleanText = text.replace(/\n/g, '').trim();

      if (cleanText.length >= 2) {
        ocrResult.innerText = cleanText;
        statusLabel.innerText = "Text detectat!";
      } else {
        statusLabel.innerText = "Căutare text...";
      }
    } catch (err) {
      console.warn("Eroare la procesarea cadrului:", err);
    }
  } else {
    // Dacă rezoluția nu s-a încărcat încă, așteptăm liniștiți
    statusLabel.innerText = "Se așteaptă calibrarea camerei...";
  }

  // Pe desktop/laptop poți lăsa timpul de așteptare puțin mai mic (ex: 800ms)
  setTimeout(scanLoop, 800);
}
</script>

</body>
</html>
