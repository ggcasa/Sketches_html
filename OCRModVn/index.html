<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Scanner VIN Pro (AI)</title>
  <style>
    body { font-family: -apple-system, sans-serif; background: #0f0f12; color: #e4e4e7; margin: 0; padding: 10px; text-align: center; }
    .container { max-width: 500px; margin: 0 auto; display: flex; flex-direction: column; gap: 15px; }
    
    /* 1. CONTAINERUL VIDEO (STRICT LIMITAT) */
    .scanner-wrapper { display: flex; justify-content: center; align-items: center; width: 100%; max-height: 45vh; }
    .scanner-container { position: relative; display: inline-block; max-width: 100%; max-height: 100%; border-radius: 12px; overflow: hidden; background: #000; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
    
    video { max-width: 100%; max-height: 45vh; display: block; object-fit: contain; }
    
    /* Vizorul roșu */
    .viewfinder { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 90%; height: 45px; border: 2px solid #ff3b30; border-radius: 4px; box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.75); pointer-events: none; transition: border-color 0.3s; }
    .viewfinder.paused { border-color: #ff9f0a; }

    /* 2. REZULTATE */
    .box { background: #1c1c1e; padding: 15px; border-radius: 10px; border: 1px solid #2c2c2e; }
    .status { font-size: 13px; color: #ff3b30; margin-bottom: 5px; font-weight: bold; }
    .result { font-family: monospace; font-size: 22px; color: #ffffff; font-weight: bold; letter-spacing: 2px; min-height: 30px; word-break: break-all; }
    .counter { font-size: 12px; color: #8e8e93; margin-top: 5px; }
    
    /* 3. BUTOANE */
    .btn { border: none; padding: 12px 20px; font-size: 16px; font-weight: bold; cursor: pointer; border-radius: 8px; width: 100%; transition: background 0.2s; }
    .btn-primary { background: #ff3b30; color: #fff; }
    .btn-secondary { background: #ff9f0a; color: #000; display: none; }
    .btn-secondary.active { background: #34c759; color: #fff;}

    /* 4. ZONA DE DEBUG (Foarte importantă pentru tine acum) */
    .debug-section { background: #111; padding: 10px; border-radius: 8px; border: 1px dashed #444; }
    .debug-label { font-size: 11px; color: #888; margin-bottom: 5px; text-transform: uppercase; }
    #cropCanvas { display: block; width: 100%; max-width: 400px; height: auto; margin: 0 auto; border: 1px solid #00ffcc; background: #000; }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body>

<div class="container">
  
  <div class="scanner-wrapper">
    <div class="scanner-container">
      <video id="video" autoplay playsinline muted></video>
      <div id="viewfinder" class="viewfinder"></div>
    </div>
  </div>

  <button id="btnStart" class="btn btn-primary">Pornește Camera</button>
  <button id="btnToggleScan" class="btn btn-secondary">Pauză Scanare</button>

  <div class="box">
    <div id="statusLabel" class="status">Așteptare cameră...</div>
    <div id="ocrResult" class="result">-----------------</div>
    <div id="charCounter" class="counter">0 / 17 caractere</div>
  </div>

  <div class="debug-section">
    <div class="debug-label">Ce citește motorul AI chiar acum:</div>
    <canvas id="cropCanvas"></canvas>
  </div>

</div>

<script>
const video = document.getElementById('video');
const btnStart = document.getElementById('btnStart');
const btnToggleScan = document.getElementById('btnToggleScan');
const statusLabel = document.getElementById('statusLabel');
const ocrResult = document.getElementById('ocrResult');
const charCounter = document.getElementById('charCounter');
const cropCanvas = document.getElementById('cropCanvas');
const cropCtx = cropCanvas.getContext('2d', { willReadFrequently: true });
const viewfinder = document.getElementById('viewfinder');

let isCameraActive = false;
let isProcessingOCR = true;
let worker = null;

async function initOCR() {
  statusLabel.innerText = "Se încarcă AI-ul...";
  worker = await Tesseract.createWorker('eng');
  
  // Regula strictă pentru VIN
  await worker.setParameters({
    tessedit_char_whitelist: '0123456789ABCDEFGHJKLMNPRSTUVWXYZ', 
  });

  statusLabel.innerText = "Sistem Pregătit. Scanați!";
  statusLabel.style.color = "#34c759";
}

btnStart.addEventListener('click', async () => {
  if (isCameraActive) return;

  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      // Pe mobil e mai sigur să cerem rezoluție standard pentru a evita lag-ul de procesare
      video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: false
    });
    
    video.srcObject = stream;
    btnStart.style.display = "none";
    btnToggleScan.style.display = "block";
    
    isCameraActive = true;
    await initOCR();
    video.addEventListener('playing', scanLoop);
  } catch (err) {
    alert("Eroare cameră: " + err.message);
  }
});

btnToggleScan.addEventListener('click', () => {
  isProcessingOCR = !isProcessingOCR;
  
  if (isProcessingOCR) {
    btnToggleScan.innerText = "Pauză Scanare";
    btnToggleScan.classList.remove('active');
    viewfinder.classList.remove('paused');
    statusLabel.innerText = "Se scanează...";
    statusLabel.style.color = "#ff3b30";
  } else {
    btnToggleScan.innerText = "Reluare Scanare";
    btnToggleScan.classList.add('active');
    viewfinder.classList.add('paused');
    statusLabel.innerText = "Scanare oprită.";
    statusLabel.style.color = "#ff9f0a";
  }
});

async function scanLoop() {
  if (!isCameraActive || !worker) return;

  if (isProcessingOCR && video.readyState >= 2 && video.videoWidth > 0) {
    
    // Matematica de decupare
    const videoRect = video.getBoundingClientRect();
    const viewRect = viewfinder.getBoundingClientRect();

    const pctLeft = (viewRect.left - videoRect.left) / videoRect.width;
    const pctTop = (viewRect.top - videoRect.top) / videoRect.height;
    const pctWidth = viewRect.width / videoRect.width;
    const pctHeight = viewRect.height / videoRect.height;

    const cropX = Math.round(pctLeft * video.videoWidth);
    const cropY = Math.round(pctTop * video.videoHeight);
    const cropW = Math.max(1, Math.round(pctWidth * video.videoWidth));
    const cropH = Math.max(1, Math.round(pctHeight * video.videoHeight));

    cropCanvas.width = cropW;
    cropCanvas.height = cropH;
    
    try {
      // Tăiem felia exactă direct de pe fluxul video (FĂRĂ filtre suplimentare)
      cropCtx.drawImage(video, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);

      // Trimitem la citit
      const { data: { text } } = await worker.recognize(cropCanvas);
      
      const cleanText = text.replace(/[^A-Z0-9]/g, '').trim();

      ocrResult.innerText = cleanText.length > 0 ? cleanText : "-----------------";
      charCounter.innerText = `${cleanText.length} / 17 caractere`;

      if (cleanText.length === 17) {
        statusLabel.innerText = "VIN DETECTAT COMPLET!";
        statusLabel.style.color = "#34c759";
        viewfinder.style.borderColor = "#34c759";
      } else {
        statusLabel.innerText = "Se procesează...";
        statusLabel.style.color = "#ff3b30";
        viewfinder.style.borderColor = "#ff3b30";
      }
    } catch (err) {
      console.warn("Eroare la procesarea cadrului:", err);
    }
  }

  // Rulăm mai rar ca să nu blocăm interfața (1.2 secunde)
  setTimeout(scanLoop, 1200);
}
</script>

</body>
</html>
