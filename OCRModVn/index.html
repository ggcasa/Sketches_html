<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scanner VIN Pro (AI)</title>
  <style>
    body { font-family: -apple-system, sans-serif; background: #0f0f12; color: #e4e4e7; margin: 0; padding: 15px; text-align: center; }
    .container { max-width: 500px; margin: 0 auto; }
    
    .scanner-container { position: relative; width: 100%; max-width: 450px; margin: 0 auto 15px auto; border-radius: 12px; overflow: hidden; background: #000; display: flex; justify-content: center; align-items: center; }
    video { width: 100%; height: auto; display: block; }
    
    /* Fantă subțire și lungă, specifică pentru VIN pe parbriz */
    .viewfinder { position: absolute; width: 95%; height: 45px; border: 2px solid #ff3b30; border-radius: 4px; box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.7); pointer-events: none; transition: border-color 0.3s; }
    
    .box { background: #1c1c1e; padding: 15px; border-radius: 10px; margin-bottom: 15px; border: 1px solid #2c2c2e; }
    .status { font-size: 13px; color: #ff3b30; margin-bottom: 5px; min-height: 18px; font-weight: bold; transition: color 0.3s; }
    .result { font-family: monospace; font-size: 24px; color: #ffffff; font-weight: bold; letter-spacing: 2px; min-height: 30px; word-break: break-all; }
    .counter { font-size: 12px; color: #8e8e93; margin-top: 5px; }
    
    button { background: #ff3b30; color: #fff; border: none; padding: 14px 28px; font-size: 16px; font-weight: bold; cursor: pointer; border-radius: 8px; width: 100%; max-width: 450px; margin-bottom: 15px; }
    
    /* Ascundem canvas-ul de debug, acum că știm că decupajul pe mobil funcționează perfect */
    #cropCanvas { display: none; }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body>

<div class="container">
  <!-- <input type="text" id="v1"> -->
  <p style="font-size: 14px; color: #8e8e93; margin-top: -10px;">Încadrați complet cele 17 caractere</p>
  
  <div class="scanner-container">
    <video id="video" autoplay playsinline muted></video>
    <div id="viewfinder" class="viewfinder"></div>
  </div>

  <button id="btnStart">Pornește Camera</button>

  <div class="box">
    <div id="statusLabel" class="status">Așteptare cameră...</div>
    <div id="ocrResult" class="result">-----------------</div>
    <div id="charCounter" class="counter">0 / 17 caractere</div>
  </div>

  <canvas id="cropCanvas"></canvas>
</div>

<script>
const v1 = document.getElementById("v1");
const video = document.getElementById('video');
const btnStart = document.getElementById('btnStart');
const statusLabel = document.getElementById('statusLabel');
const ocrResult = document.getElementById('ocrResult');
const charCounter = document.getElementById('charCounter');
const cropCanvas = document.getElementById('cropCanvas');
const cropCtx = cropCanvas.getContext('2d', { willReadFrequently: true });
const viewfinder = document.getElementById('viewfinder');

let isScanning = false;
let worker = null;

async function initOCR() {
  statusLabel.innerText = "Se încarcă motorul AI...";
  worker = await Tesseract.createWorker('eng');
  
  // REGULA PENTRU VIN: Doar cifre și litere mari, FĂRĂ I, O, și Q.
  await worker.setParameters({
    tessedit_char_whitelist: '0123456789ABCDEFGHJKLMNPRSTUVWXYZ',
  });

  statusLabel.innerText = "Sistem Pregătit. Scanați!";
  statusLabel.style.color = "#34c759"; // Verde când e gata
}

btnStart.addEventListener('click', async () => {
  if (isScanning) return;

  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "environment", width: { ideal: 1920 }, height: { ideal: 1080 } },
      audio: false
    });
    
    video.srcObject = stream;
    btnStart.style.display = "none";
    isScanning = true;

    // Așteptăm să se încarce AI-ul
    await initOCR();
    
    // CORECTURĂ: Pornim bucla direct, pentru că video-ul deja rulează în fundal!
    scanLoop(); 
    
  } catch (err) {
    alert("Eroare acces cameră: " + err.message);
  }
});

// Funcție pentru curățarea zgomotului vizual și pregătirea pentru Tesseract
function enhanceImageForVIN(ctx, width, height) {
  const imgData = ctx.getImageData(0, 0, width, height);
  const data = imgData.data;
  
  // 1. Calculăm luminozitatea medie pentru a ști dacă fundalul e negru sau alb
  let totalBrightness = 0;
  for (let i = 0; i < data.length; i += 4) {
    totalBrightness += (data[i] + data[i+1] + data[i+2]) / 3;
  }
  const avgBrightness = totalBrightness / (width * height);
  
  // Dacă luminozitatea medie e sub 120, înseamnă că avem text luminos pe fundal întunecat.
  const shouldInvert = avgBrightness < 120;

  // 2. Binarizare și Inversare
  for (let i = 0; i < data.length; i += 4) {
    let gray = (data[i] + data[i+1] + data[i+2]) / 3;
    
    // Creștem contrastul masiv (Prag de binarizare)
    if (gray > 130) gray = 255; // Alb pur
    else gray = 0;              // Negru pur

    // Dacă fundalul era întunecat, inversăm culorile (Tesseract iubește textul negru pe alb)
    if (shouldInvert) {
      gray = 255 - gray; 
    }

    data[i] = gray;     // R
    data[i+1] = gray;   // G
    data[i+2] = gray;   // B
  }
  
  // Suprascriem canvas-ul cu imaginea curățată
  ctx.putImageData(imgData, 0, 0);
}

async function scanLoop() {
  if (!isScanning || !worker) return;

  if (video.readyState >= 2 && video.videoWidth > 0 && video.videoHeight > 0) {
    const videoRect = video.getBoundingClientRect();
    const viewRect = viewfinder.getBoundingClientRect();

    const pctLeft = (viewRect.left - videoRect.left) / videoRect.width;
    const pctTop = (viewRect.top - videoRect.top) / videoRect.height;
    const pctWidth = viewRect.width / videoRect.width;
    const pctHeight = viewRect.height / videoRect.height;

    const cropX = Math.round(pctLeft * video.videoWidth);
    const cropY = Math.round(pctTop * video.videoHeight);
    const cropW = Math.max(1, Math.round(pctWidth * video.videoWidth));
    const cropH = Math.max(1, Math.round(pctHeight * video.videoHeight));

    cropCanvas.width = cropW;
    cropCanvas.height = cropH;
    
    try {
      // 1. APLICĂM FILTRELE MAGICE ÎNAINTE DE A DESENA
      // Grayscale: scoate culorile parbrizului
      // Blur: umflă literele subțiri / punctele, făcându-le să se atingă
      // Contrast: întărește zonele atinse transformându-le în litere groase și clare
      cropCtx.filter = 'grayscale(100%) contrast(300%) blur(1px)';
      
      // 2. Desenăm imaginea tăiată
      cropCtx.drawImage(video, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);
      // --- ADAUGĂ ACEASTĂ LINIE AICI ---
      enhanceImageForVIN(cropCtx, cropW, cropH);
      // ---------------------------------

      // AI-ul face magia...
      // const { data: { text } } = await worker.recognize(cropCanvas);
     
      // Resetăm filtrul ca să nu afecteze alte operațiuni viitoare
      cropCtx.filter = 'none'; 

      statusLabel.innerText = "Se analizează imaginea...";
      const { data: { text } } = await worker.recognize(cropCanvas);
      
      const cleanText = text.replace(/[^A-Z0-9]/g, '').trim();

      ocrResult.innerText = cleanText.length > 0 ? cleanText : "-----------------";
      charCounter.innerText = `${cleanText.length} / 17 caractere`;
    
      if (cleanText.length === 17 && x == cleanText) {
        statusLabel.innerText = `VIN DETECTAT COMPLET! ${v1.value}`;
        statusLabel.style.color = "#34c759";
        viewfinder.style.borderColor = "#34c759";
      } else {
        statusLabel.innerText = "Se procesează...";
        statusLabel.style.color = "#ff3b30";
        viewfinder.style.borderColor = "#ff3b30";
      }
    } catch (err) {
      console.warn("Cadru ignorat:", err);
    }
  }

  // OPTIMIZARE TIMING:
  setTimeout(scanLoop, 500); 
}
</script>

</body>
</html>
