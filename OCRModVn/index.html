<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mod vn 1 (AI)</title>
  <style>
    body { font-family: -apple-system, sans-serif; background: #0f0f12; color: #e4e4e7; margin: 0; padding: 15px; text-align: center; }
    .container { max-width: 500px; margin: 0 auto; }
    
    .scanner-container { position: relative; width: 100%; height: 320px; max-width: 450px; margin: 0 auto 15px auto; border-radius: 12px; overflow: hidden; background: #000; }
    video { width: 100%; height: 100%; object-fit: cover; display: block; }
    .viewfinder { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 95%; height: 45px; border: 2px solid #ff3b30; border-radius: 4px; box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.7); pointer-events: none; transition: border-color 0.3s; }
    
    .box { background: #1c1c1e; padding: 15px; border-radius: 10px; margin-bottom: 15px; border: 1px solid #2c2c2e; }
    .status { font-size: 13px; color: #ff3b30; margin-bottom: 5px; min-height: 18px; font-weight: bold; transition: color 0.3s; }
    .result { font-family: monospace; font-size: 24px; color: #ffffff; font-weight: bold; letter-spacing: 2px; min-height: 30px; word-break: break-all; }
    .counter { font-size: 12px; color: #8e8e93; margin-top: 5px; }
    
    .button-group { display: flex; gap: 10px; max-width: 450px; margin: 0 auto 15px auto; }
    button { color: #000; border: none; padding: 14px 20px; font-size: 16px; font-weight: bold; cursor: pointer; border-radius: 8px; flex: 1; transition: 0.2s; }
    #btnAction { background: #ff9500; }
    #btnAction.active { background: #ff3b30; color: #fff; }
    #btnCopy { background: #0a84ff; color: #fff; display: none; }
    #btnCopy:active { background: #0060d1; }
    
    .debug-label { font-size: 11px; color: #888; margin-top: 10px; text-transform: uppercase; letter-spacing: 1px; }
    #cropCanvas { display: block; width: 100%; max-width: 450px; height: auto; border: 1px solid #333; margin: 5px auto; background: #000; }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body>

<div class="container">
  <h2>Scanner VIN Auto</h2>
  <p style="font-size: 14px; color: #8e8e93; margin-top: -10px;">Încadrați complet cele 17 caractere</p>
  
  <div class="scanner-container">
    <video id="video" autoplay playsinline muted></video>
    <div id="viewfinder" class="viewfinder"></div>
  </div>

  <div class="button-group">
    <button id="btnAction">Pornește Camera</button>
    <button id="btnCopy">Copiază VIN</button>
  </div>

  <div class="box">
    <div id="statusLabel" class="status">Așteptare cameră...</div>
    <div id="ocrResult" class="result">-----------------</div>
    <div id="charCounter" class="counter">0 / 17 caractere</div>
  </div>

  <div class="debug-label">Analiză Optică:</div>
  <canvas id="cropCanvas"></canvas>
</div>

<script>
const video = document.getElementById('video');
const btnAction = document.getElementById('btnAction');
const btnCopy = document.getElementById('btnCopy');
const statusLabel = document.getElementById('statusLabel');
const ocrResult = document.getElementById('ocrResult');
const charCounter = document.getElementById('charCounter');
const cropCanvas = document.getElementById('cropCanvas');
const cropCtx = cropCanvas.getContext('2d', { willReadFrequently: true });
const viewfinder = document.getElementById('viewfinder');

let isCameraOn = false;
let isPaused = false;
let worker = null;

async function initOCR() {
  statusLabel.innerText = "Se încarcă motorul AI...";
  worker = await Tesseract.createWorker('eng');
  await worker.setParameters({
    tessedit_char_whitelist: '0123456789ABCDEFGHJKLMNPRSTUVWXYZ',
  });
  statusLabel.innerText = "Sistem Pregătit. Scanați!";
  statusLabel.style.color = "#34c759";
}

btnAction.addEventListener('click', async () => {
  if (!isCameraOn) {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "environment", width: { ideal: 1080 }, height: { ideal: 1920 } },
        audio: false
      });
      video.srcObject = stream;
      isCameraOn = true;
      btnAction.innerText = "Pauză Scanare";
      btnAction.classList.add("active");

      await initOCR();
      
      // FIX-UL AICI: Am eliminat "evenimentul" care rata startul și apelăm bucla direct.
      scanLoop(); 
      
    } catch (err) {
      alert("Eroare acces cameră: " + err.message);
    }
  } else {
    isPaused = !isPaused;
    if (isPaused) {
      btnAction.innerText = "Reluare Scanare";
      btnAction.classList.remove("active");
      btnCopy.style.display = "block";
      statusLabel.innerText = "Scanare Oprită.";
    } else {
      btnAction.innerText = "Pauză Scanare";
      btnAction.classList.add("active");
      btnCopy.style.display = "none";
      statusLabel.innerText = "Se scanează...";
      statusLabel.style.color = "#ff3b30";
      viewfinder.style.borderColor = "#ff3b30";
    }
  }
});

btnCopy.addEventListener('click', () => {
  const textToCopy = ocrResult.innerText;
  if (textToCopy && textToCopy !== "-----------------") {
    navigator.clipboard.writeText(textToCopy).then(() => {
      const originalText = btnCopy.innerText;
      btnCopy.innerText = "Cod Copiat!";
      btnCopy.style.background = "#34c759";
      setTimeout(() => {
        btnCopy.innerText = originalText;
        btnCopy.style.background = "#0a84ff";
      }, 2000);
    }).catch(err => {
      alert("Nu am putut copia codul: " + err);
    });
  }
});

function applyHighContrast(ctx, width, height) {
  const imgData = ctx.getImageData(0, 0, width, height);
  const data = imgData.data;
  
  for (let i = 0; i < data.length; i += 4) {
    let gray = (data[i] + data[i+1] + data[i+2]) / 3;
    gray = (gray - 128) * 1.8 + 128; 
    gray = Math.max(0, Math.min(255, gray)); 
    data[i] = gray; 
    data[i+1] = gray; 
    data[i+2] = gray;
    data[i+3] = 255; // Forțăm opacitatea maximă ca să nu apară erori de transparență
  }
  ctx.putImageData(imgData, 0, 0);
}

async function scanLoop() {
  if (!isCameraOn || !worker) return;
  
  if (isPaused) {
    setTimeout(scanLoop, 500);
    return;
  }

  // Aici așteaptă oricum până când camera livrează o rezoluție reală
  if (video.readyState >= 2 && video.videoWidth > 0 && video.videoHeight > 0) {
    
    const videoRect = video.getBoundingClientRect();
    const viewRect = viewfinder.getBoundingClientRect();
    
    const scale = Math.max(videoRect.width / video.videoWidth, videoRect.height / video.videoHeight);
    const dx = (videoRect.width - (video.videoWidth * scale)) / 2;
    const dy = (videoRect.height - (video.videoHeight * scale)) / 2;

    const cropX = Math.round(((viewRect.left - videoRect.left) - dx) / scale);
    const cropY = Math.round(((viewRect.top - videoRect.top) - dy) / scale);
    const cropW = Math.max(1, Math.round(viewRect.width / scale));
    const cropH = Math.max(1, Math.round(viewRect.height / scale));

    cropCanvas.width = cropW;
    cropCanvas.height = cropH;
    
    try {
      cropCtx.drawImage(video, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);
      applyHighContrast(cropCtx, cropW, cropH);

      const { data: { text } } = await worker.recognize(cropCanvas);
      const cleanText = text.replace(/[^A-Z0-9]/g, '').trim();

      if (cleanText.length > 0) {
        ocrResult.innerText = cleanText;
        charCounter.innerText = `${cleanText.length} / 17 caractere`;
      }

      if (cleanText.length === 17) {
        statusLabel.innerText = "VIN VALIDAT! Scanare oprită.";
        statusLabel.style.color = "#34c759";
        viewfinder.style.borderColor = "#34c759";
        
        isPaused = true;
        btnAction.innerText = "Reluare Scanare";
        btnAction.classList.remove("active");
        btnCopy.style.display = "block"; 
      } else {
        statusLabel.innerText = "Se scanează...";
        statusLabel.style.color = "#ff3b30";
        viewfinder.style.borderColor = "#ff3b30";
      }
    } catch (err) {
      console.warn("Eroare la procesarea cadrului:", err);
    }
  }
  
  // Rulează o dată pe secundă
  setTimeout(scanLoop, 1000);
}
</script>

</body>
</html>
