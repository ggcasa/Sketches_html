<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scanner VIN Auto (Pro)</title>
  <style>
    body { font-family: -apple-system, sans-serif; background: #0f0f12; color: #e4e4e7; margin: 0; padding: 15px; text-align: center; }
    .container { max-width: 500px; margin: 0 auto; }
    .scanner-container { position: relative; width: 100%; height: 320px; max-width: 450px; margin: 0 auto 15px auto; border-radius: 12px; overflow: hidden; background: #000; }
    video { width: 100%; height: 100%; object-fit: cover; display: block; }
    .viewfinder { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 95%; height: 45px; border: 2px solid #ff3b30; border-radius: 4px; box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.7); pointer-events: none; transition: border-color 0.3s; }
    .box { background: #1c1c1e; padding: 15px; border-radius: 10px; margin-bottom: 15px; border: 1px solid #2c2c2e; }
    .status { font-size: 13px; color: #ff3b30; margin-bottom: 5px; font-weight: bold; }
    .result { font-family: monospace; font-size: 24px; color: #ffffff; font-weight: bold; letter-spacing: 2px; min-height: 30px; word-break: break-all; }
    button { background: #ff3b30; color: #fff; border: none; padding: 14px 28px; font-size: 16px; font-weight: bold; cursor: pointer; border-radius: 8px; width: 100%; max-width: 450px; margin-bottom: 15px; }
    #cropCanvas { display: block; width: 100%; max-width: 450px; height: auto; border: 1px solid #333; margin: 5px auto; background: #000; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body>

<div class="container">
  <h2>Scanner VIN Auto</h2>
  <div class="scanner-container">
    <video id="video" autoplay playsinline muted></video>
    <div id="viewfinder" class="viewfinder"></div>
  </div>

  <button id="btnStart">Pornește Scanarea</button>

  <div class="box">
    <div id="statusLabel" class="status">Așteptare cameră...</div>
    <div id="ocrResult" class="result">-----------------</div>
  </div>

  <canvas id="cropCanvas"></canvas>
</div>

<script>
const video = document.getElementById('video'),
      btnStart = document.getElementById('btnStart'),
      statusLabel = document.getElementById('statusLabel'),
      ocrResult = document.getElementById('ocrResult'),
      cropCanvas = document.getElementById('cropCanvas'),
      cropCtx = cropCanvas.getContext('2d', { willReadFrequently: true }),
      viewfinder = document.getElementById('viewfinder');

let isScanning = false, worker = null, feedbackPlayed = false;

async function initOCR() {
  worker = await Tesseract.createWorker('eng');
  await worker.setParameters({ tessedit_char_whitelist: '0123456789ABCDEFGHJKLMNPRSTUVWXYZ' });
  statusLabel.innerText = "Sistem Pregătit!";
  statusLabel.style.color = "#34c759";
}

function triggerSuccessFeedback() {
  if ("vibrate" in navigator) navigator.vibrate([150, 50, 150]);
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(880, ctx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(1760, ctx.currentTime + 0.1);
  gain.gain.setValueAtTime(0, ctx.currentTime);
  gain.gain.linearRampToValueAtTime(0.5, ctx.currentTime + 0.05);
  gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(); osc.stop(ctx.currentTime + 0.3);
}

function enhanceImage(ctx, w, h) {
  const imgData = ctx.getImageData(0, 0, w, h);
  const data = imgData.data;
  let brightness = 0;
  for (let i = 0; i < data.length; i += 4) brightness += (data[i] + data[i+1] + data[i+2]) / 3;
  const inv = (brightness / (w * h)) < 120;
  for (let i = 0; i < data.length; i += 4) {
    let g = (data[i] + data[i+1] + data[i+2]) / 3 > 110 ? 255 : 0;
    if (inv) g = 255 - g;
    data[i] = data[i+1] = data[i+2] = g;
  }
  ctx.putImageData(imgData, 0, 0);
}

btnStart.addEventListener('click', async () => {
  if (isScanning) return;
  const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment", width: { ideal: 1920 }, height: { ideal: 1080 } } });
  video.srcObject = stream;
  btnStart.style.display = "none";
  isScanning = true;
  await initOCR();
  video.addEventListener('playing', scanLoop);
});

async function scanLoop() {
  if (!isScanning) return;
  const vR = video.getBoundingClientRect(), fR = viewfinder.getBoundingClientRect();
  const sX = video.videoWidth / vR.width, sY = video.videoHeight / vR.height;
  
  cropCanvas.width = Math.round(fR.width * sX);
  cropCanvas.height = Math.round(fR.height * sY);
  
  cropCtx.drawImage(video, (fR.left - vR.left) * sX, (fR.top - vR.top) * sY, cropCanvas.width, cropCanvas.height, 0, 0, cropCanvas.width, cropCanvas.height);
  enhanceImage(cropCtx, cropCanvas.width, cropCanvas.height);

  const { data: { text } } = await worker.recognize(cropCanvas);
  const vin = text.replace(/[^A-Z0-9]/g, '').trim();

  if (vin.length === 17) {
    ocrResult.innerText = vin;
    statusLabel.innerText = "VIN DETECTAT!";
    if (!feedbackPlayed) { triggerSuccessFeedback(); feedbackPlayed = true; }
  } else {
    if (vin.length > 0) ocrResult.innerText = vin;
    feedbackPlayed = false;
  }
  setTimeout(scanLoop, 500);
}
</script>
</body>
</html>
