<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scanner VIN Pro (AI)</title>
  <style>
    body { font-family: -apple-system, sans-serif; background: #0f0f12; color: #e4e4e7; margin: 0; padding: 15px; text-align: center; }
    .container { max-width: 500px; margin: 0 auto; }
    
    /* Container fix, nu mai ocupă tot ecranul, previne lăbărțarea */
    .scanner-container { position: relative; width: 100%; height: 320px; max-width: 450px; margin: 0 auto 15px auto; border-radius: 12px; overflow: hidden; background: #000; }
    
    /* Video-ul își păstrează proporțiile naturale tăind marginile în plus */
    video { width: 100%; height: 100%; object-fit: cover; display: block; }
    
    /* Vizorul centrat perfect pe ecran */
    .viewfinder { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 95%; height: 45px; border: 2px solid #ff3b30; border-radius: 4px; box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.7); pointer-events: none; transition: border-color 0.3s; }
    
    .box { background: #1c1c1e; padding: 15px; border-radius: 10px; margin-bottom: 15px; border: 1px solid #2c2c2e; }
    .status { font-size: 13px; color: #ff3b30; margin-bottom: 5px; min-height: 18px; font-weight: bold; transition: color 0.3s; }
    .result { font-family: monospace; font-size: 24px; color: #ffffff; font-weight: bold; letter-spacing: 2px; min-height: 30px; word-break: break-all; }
    .counter { font-size: 12px; color: #8e8e93; margin-top: 5px; }
    
    button { background: #ff3b30; color: #fff; border: none; padding: 14px 28px; font-size: 16px; font-weight: bold; cursor: pointer; border-radius: 8px; width: 100%; max-width: 450px; margin-bottom: 15px; }
    
    .debug-label { font-size: 12px; color: #888; margin-top: 10px; text-transform: uppercase; letter-spacing: 1px;}
    
    /* Canvas-ul de debug vizibil, unde vei vedea filtrul acționând */
    #cropCanvas { display: block; width: 100%; max-width: 450px; height: auto; border: 1px solid #333; margin: 5px auto; background: #000; }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body>

<div class="container">
  <h2>Scanner VIN Auto</h2>
  <p style="font-size: 14px; color: #8e8e93; margin-top: -10px;">Încadrați complet cele 17 caractere</p>
  
  <div class="scanner-container">
    <video id="video" autoplay playsinline muted></video>
    <div id="viewfinder" class="viewfinder"></div>
  </div>

  <button id="btnStart">Pornește Camera</button>

  <div class="box">
    <div id="statusLabel" class="status">Așteptare cameră...</div>
    <div id="ocrResult" class="result">-----------------</div>
    <div id="charCounter" class="counter">0 / 17 caractere</div>
  </div>

  <div class="debug-label">Ce citește motorul AI chiar acum:</div>
  <canvas id="cropCanvas"></canvas>
</div>

<script>
const video = document.getElementById('video');
const btnStart = document.getElementById('btnStart');
const statusLabel = document.getElementById('statusLabel');
const ocrResult = document.getElementById('ocrResult');
const charCounter = document.getElementById('charCounter');
const cropCanvas = document.getElementById('cropCanvas');
const cropCtx = cropCanvas.getContext('2d', { willReadFrequently: true });
const viewfinder = document.getElementById('viewfinder');

let isScanning = false;
let worker = null;

// Inițializare Tesseract cu filtru strict pentru VIN
async function initOCR() {
  statusLabel.innerText = "Se încarcă motorul AI...";
  worker = await Tesseract.createWorker('eng');
  
  // Excludem I, O, Q și caracterele mici conform standardului ISO 3779
  await worker.setParameters({
    tessedit_char_whitelist: '0123456789ABCDEFGHJKLMNPRSTUVWXYZ',
  });

  statusLabel.innerText = "Sistem Pregătit. Scanați!";
  statusLabel.style.color = "#34c759";
}

// Pornire cameră
btnStart.addEventListener('click', async () => {
  if (isScanning) return;

  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      // Forțăm format Portrait (vertical) pentru a corespunde felului în care ții telefonul
      video: { facingMode: "environment", width: { ideal: 1080 }, height: { ideal: 1920 } },
      audio: false
    });
    
    video.srcObject = stream;
    btnStart.style.display = "none";
    isScanning = true;

    await initOCR();
    video.addEventListener('playing', scanLoop);
  } catch (err) {
    alert("Eroare acces cameră: " + err.message);
  }
});

// Filtrul "Anti-Teren" - Curăță zgomotul vizual, reflexiile sticlei și face textul alb-negru
function enhanceImageForVIN(ctx, width, height) {
  const imgData = ctx.getImageData(0, 0, width, height);
  const data = imgData.data;
  
  let totalBrightness = 0;
  for (let i = 0; i < data.length; i += 4) {
    totalBrightness += (data[i] + data[i+1] + data[i+2]) / 3;
  }
  const avgBrightness = totalBrightness / (width * height);
  const shouldInvert = avgBrightness < 120; // Dacă e întunecat, inversăm pentru Tesseract

  for (let i = 0; i < data.length; i += 4) {
    let gray = (data[i] + data[i+1] + data[i+2]) / 3;
    
    // Binarizare puternică: peste prag devine alb pur, sub prag devine negru pur
    gray = gray > 110 ? 255 : 0;

    if (shouldInvert) {
      gray = 255 - gray; 
    }

    data[i] = gray;     // R
    data[i+1] = gray;   // G
    data[i+2] = gray;   // B
  }
  ctx.putImageData(imgData, 0, 0);
}

// Bucla principală de analiză a cadrelor
async function scanLoop() {
  if (!isScanning || !worker) return;

  if (video.readyState >= 2 && video.videoWidth > 0 && video.videoHeight > 0) {
    
    // Matematică ajustată pentru "object-fit: cover"
    const videoRatio = video.videoWidth / video.videoHeight;
    const containerRatio = video.offsetWidth / video.offsetHeight;
    
    let drawWidth = video.offsetWidth;
    let drawHeight = video.offsetHeight;
    let offsetX = 0;
    let offsetY = 0;

    // Calculăm exact cât din video e tăiat "invizibil" de marginile CSS-ului
    if (videoRatio > containerRatio) {
      drawWidth = video.offsetHeight * videoRatio;
      offsetX = (video.offsetWidth - drawWidth) / 2;
    } else {
      drawHeight = video.offsetWidth / videoRatio;
      offsetY = (video.offsetHeight - drawHeight) / 2;
    }

    const scaleX = video.videoWidth / drawWidth;
    const scaleY = video.videoHeight / drawHeight;

    const viewRect = viewfinder.getBoundingClientRect();
    const videoRect = video.getBoundingClientRect();

    // Mapare precisă de la ecran la pixelii senzorului camerei
    const cropX = Math.round((viewRect.left - videoRect.left - offsetX) * scaleX);
    const cropY = Math.round((viewRect.top - videoRect.top - offsetY) * scaleY);
    const cropW = Math.max(1, Math.round(viewRect.width * scaleX));
    const cropH = Math.max(1, Math.round(viewRect.height * scaleY));

    cropCanvas.width = cropW;
    cropCanvas.height = cropH;
    
    try {
      // 1. Tăiem doar felia de interes
      cropCtx.drawImage(video, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);
      
      // 2. Aplicăm filtrul magic pentru VIN (repară textul de sub parbriz)
      enhanceImageForVIN(cropCtx, cropW, cropH);

      // 3. Trimitem imaginea alb-negru către motorul AI
      const { data: { text } } = await worker.recognize(cropCanvas);
      
      // 4. Eliminăm gunoaiele din string (păstrăm strict formatul auto)
      const cleanText = text.replace(/[^A-Z0-9]/g, '').trim();

      ocrResult.innerText = cleanText.length > 0 ? cleanText : "-----------------";
      charCounter.innerText = `${cleanText.length} / 17 caractere`;

      // 5. Validare UI
      if (cleanText.length === 17) {
        statusLabel.innerText = "VIN DETECTAT COMPLET!";
        statusLabel.style.color = "#34c759";
        viewfinder.style.borderColor = "#34c759";
      } else {
        statusLabel.innerText = "Se scanează...";
        statusLabel.style.color = "#ff3b30";
        viewfinder.style.borderColor = "#ff3b30";
      }
    } catch (err) {
      console.warn("Cadru ignorat:", err);
    }
  }
  
  // Procesăm cadrul din secundă în secundă (ideal pentru mobil)
  setTimeout(scanLoop, 1000);
}
</script>

</body>
</html>
